<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Spark Lakehouse Agent Platform — Phase 1 architecture</title>
  <desc id="desc">Local Docker Compose architecture showing Spark master and two workers, JupyterLab, Ollama with Qwen, shared lakehouse folders, and MinIO. Spark S3A integration is planned for Phase 2.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf2f8"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#142b4a"/><stop offset="1" stop-color="#245b83"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#55718d"/></marker>
    <style>
      .h1{font:700 32px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#dce9f5}
      .section{font:700 19px Arial,sans-serif;fill:#203b59}.label{font:700 17px Arial,sans-serif;fill:#203b59}
      .body{font:15px Arial,sans-serif;fill:#435b73}.small{font:13px Arial,sans-serif;fill:#536b82}
      .card{fill:#fff;stroke:#cbd7e4;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .blue{fill:#eaf3fb;stroke:#6d9bc2}.purple{fill:#f2edfb;stroke:#9b83c7}.green{fill:#eaf6ef;stroke:#70aa85}.amber{fill:#fff5e4;stroke:#d5a34d}
      .line{fill:none;stroke:#55718d;stroke-width:3;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#bd8731;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#arrow)}
      .pill{font:700 12px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="36" y="28" width="1368" height="112" rx="20" fill="url(#head)"/>
  <text x="76" y="78" class="h1">Spark Lakehouse Agent Platform</text>
  <text x="78" y="109" class="sub">Phase 1 · Local development topology · Docker Compose v2</text>
  <rect x="1190" y="58" width="166" height="34" rx="17" fill="#2d8b62"/>
  <text x="1273" y="80" text-anchor="middle" class="pill">PHASE 1 FOUNDATION</text>

  <rect x="55" y="174" width="1330" height="565" rx="24" fill="#f9fbfd" stroke="#a9bdcf" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="82" y="210" class="section">Local workstation · Private Docker network: spark-lakehouse-network</text>

  <rect x="88" y="252" width="530" height="230" class="card blue"/>
  <text x="118" y="286" class="label">Apache Spark Standalone</text>
  <rect x="118" y="312" width="470" height="62" rx="11" fill="#d8e9f8" stroke="#7ba4c9"/>
  <text x="140" y="338" class="label">Spark Master</text><text x="140" y="359" class="small">RPC :7077 · Web UI :8080</text>
  <rect x="118" y="394" width="220" height="62" rx="11" fill="#fff" stroke="#7ba4c9"/>
  <text x="138" y="420" class="label">Worker 1</text><text x="138" y="441" class="small">2 cores · 3 GiB · UI :8081</text>
  <rect x="368" y="394" width="220" height="62" rx="11" fill="#fff" stroke="#7ba4c9"/>
  <text x="388" y="420" class="label">Worker 2</text><text x="388" y="441" class="small">2 cores · 3 GiB · UI :8082</text>

  <rect x="670" y="252" width="310" height="230" class="card purple"/>
  <text x="700" y="286" class="label">JupyterLab</text>
  <text x="700" y="321" class="body">Custom Spark + Python image</text>
  <text x="700" y="350" class="body">PySpark notebooks &amp; tests</text>
  <text x="700" y="379" class="body">Host UI: localhost:8888</text>
  <rect x="700" y="412" width="250" height="42" rx="10" fill="#e3d9f4"/>
  <text x="825" y="438" text-anchor="middle" class="small">Spark client → spark-master:7077</text>

  <rect x="1032" y="252" width="310" height="230" class="card green"/>
  <text x="1062" y="286" class="label">Ollama · Local LLM runtime</text>
  <text x="1062" y="329" class="body">Model: Qwen 2.5 3B</text>
  <text x="1062" y="358" class="body">API: localhost:11434</text>
  <text x="1062" y="387" class="body">Container endpoint:</text>
  <text x="1062" y="414" class="small">http://ollama:11434</text>
  <rect x="1062" y="435" width="245" height="26" rx="13" fill="#32845a"/>
  <text x="1184" y="453" text-anchor="middle" class="pill">MODEL PERSISTED IN VOLUME</text>

  <path d="M618 360 H660" class="line"/>
  <path d="M980 360 H1022" class="line"/>
  <path d="M352 482 V532 H500" class="line"/>
  <path d="M825 482 V532" class="line"/>

  <rect x="88" y="548" width="780" height="150" class="card amber"/>
  <text x="118" y="583" class="label">Shared lakehouse workspace · Host folder mounted at /lakehouse</text>
  <rect x="118" y="608" width="150" height="58" rx="9" fill="#fff" stroke="#d5a34d"/>
  <text x="193" y="633" text-anchor="middle" class="label">RAW</text><text x="193" y="652" text-anchor="middle" class="small">source extracts</text>
  <rect x="286" y="608" width="150" height="58" rx="9" fill="#fff" stroke="#d5a34d"/>
  <text x="361" y="633" text-anchor="middle" class="label">BRONZE</text><text x="361" y="652" text-anchor="middle" class="small">raw persisted data</text>
  <rect x="454" y="608" width="150" height="58" rx="9" fill="#fff" stroke="#d5a34d"/>
  <text x="529" y="633" text-anchor="middle" class="label">SILVER</text><text x="529" y="652" text-anchor="middle" class="small">cleaned data</text>
  <rect x="622" y="608" width="210" height="58" rx="9" fill="#fff" stroke="#d5a34d"/>
  <text x="727" y="633" text-anchor="middle" class="label">GOLD + CHECKPOINTS</text><text x="727" y="652" text-anchor="middle" class="small">curated data &amp; state</text>

  <rect x="930" y="548" width="412" height="150" class="card green"/>
  <text x="960" y="583" class="label">MinIO · S3-compatible object storage</text>
  <text x="960" y="620" class="body">API: localhost:9000</text>
  <text x="960" y="647" class="body">Console: localhost:9001</text>
  <text x="960" y="676" class="small">Persistent Docker volume · S3A integration planned for Phase 2</text>
  <path d="M868 624 H920" class="dashed"/>

  <rect x="88" y="770" width="1254" height="78" rx="15" fill="#fff8e9" stroke="#d5a34d" stroke-width="1.5"/>
  <text x="116" y="801" class="label">Phase boundary</text>
  <text x="116" y="827" class="body">Phase 1: local shared filesystem + validated Spark cluster. Phase 2: configure Spark S3A, provision buckets, and connect Spark to MinIO.</text>
  <text x="1380" y="882" text-anchor="end" class="small">Data2AI · Architecture overview · Not a production deployment blueprint</text>
</svg>