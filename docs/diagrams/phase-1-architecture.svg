<rect x="48" y="1298" width="1704" height="1" fill="#cad5df"/>
<text x="68" y="1314" class="small">PHASE BOUNDARY: Spark uses the shared local /lakehouse filesystem in Phase 1. Spark S3A ↔ MinIO integration is Phase 2 (dashed/roadmap only).</text>
