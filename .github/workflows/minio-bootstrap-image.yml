name: MinIO bootstrap image

on:
  pull_request:
    paths:
      - ".github/workflows/minio-bootstrap-image.yml"
      - "docker-compose.yml"
      - ".env.example"
      - "infrastructure/minio/mc/**"
      - "scripts/bootstrap-minio.sh"
      - "scripts/up.sh"
  push:
    branches:
      - main
      - feature/minio-least-privilege
    paths:
      - ".github/workflows/minio-bootstrap-image.yml"
      - "docker-compose.yml"
      - ".env.example"
      - "infrastructure/minio/mc/**"
      - "scripts/bootstrap-minio.sh"
      - "scripts/up.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare non-secret Compose environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate bootstrap shell syntax
        run: bash -n scripts/bootstrap-minio.sh scripts/up.sh

      - name: Build pinned MinIO Client image
        run: docker compose build minio-init

      - name: Smoke-test MinIO Client container
        run: docker compose --profile bootstrap run --rm --no-deps minio-init --version
