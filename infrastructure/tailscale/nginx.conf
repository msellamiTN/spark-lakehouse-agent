server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\\n";
    }

    client_max_body_size 10m;

    # Preserve each MCP route and support long-lived Streamable HTTP/SSE responses.
    location = /spark/mcp {
        proxy_pass http://spark-mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /minio/mcp {
        proxy_pass http://minio-mcp:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        default_type text/plain;
        return 404 "Use /spark/mcp or /minio/mcp\\n";
    }
}
