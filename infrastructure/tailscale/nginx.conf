server {
    listen 8080;
    server_name _;

    # Keep the MCP endpoint path intact and disable buffering for SSE responses.
    location = /spark/mcp {
        proxy_pass http://spark-mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /minio/mcp {
        proxy_pass http://minio-mcp:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        default_type text/plain;
        return 404 "Use /spark/mcp or /minio/mcp\n";
    }
}
