# Experimental overlay: Tailscale sidecar + internal Nginx reverse proxy.
# Base stack remains unchanged. Start with:
# docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#
# Required .env value: TS_AUTHKEY (tagged key authorized for tag:spark-lakehouse-mcp).
# Never commit .env or share the server auth key with students.

services:
  tailscale-proxy:
    image: nginx:1.27-alpine
    container_name: lakehouse-tailscale-proxy
    hostname: tailscale-proxy
    volumes:
      - ./infrastructure/tailscale/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      spark-mcp:
        condition: service_healthy
      minio-mcp:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || test $$? -eq 8"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  tailscale-mcp:
    image: tailscale/tailscale:stable
    container_name: lakehouse-tailscale-mcp
    hostname: spark-lakehouse-mcp
    network_mode: "service:tailscale-proxy"
    depends_on:
      tailscale-proxy:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in the untracked .env file}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: spark-lakehouse-mcp
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:spark-lakehouse-mcp
    volumes:
      - tailscale_mcp_state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

volumes:
  tailscale_mcp_state:
