# Shared Spark/Hadoop configuration for the MinIO S3-compatible object store.
# Credentials are injected as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY at runtime;
# never place credentials in this file or in source control.

spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.endpoint.region us-east-1
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.ssl.channel.mode default_jsse
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# Conservative defaults for a single-host training/lab deployment.
spark.hadoop.fs.s3a.connection.maximum 64
spark.hadoop.fs.s3a.threads.max 16
spark.hadoop.fs.s3a.multipart.size 67108864
spark.hadoop.fs.s3a.fast.upload true
