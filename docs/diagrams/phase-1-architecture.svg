<!-- persistence plane -->
<rect x="78" y="1200" width="1628" height="88" rx="14" fill="#fff" stroke="#c6d3df" stroke-width="1.2"/>
<text x="102" y="1232" class="band">D  /  PERSISTENCE &amp; DATA DOMAINS</text>
<rect x="470" y="1214" width="330" height="54" rx="9" class="amber"/>
<text x="635" y="1237" text-anchor="middle" class="node">./lakehouse → /lakehouse</text>
