 .eyebrow{font:700 11px Inter,Arial,sans-serif;letter-spacing:2px;fill:#a9c2d8}
 .band{font:700 15px Inter,Arial,sans-serif;letter-spacing:1px;fill:#24435f}
 .node{font:700 18px Inter,Arial,sans-serif;fill:#18344e}.desc{font:13px Inter,Arial,sans-serif;fill:#536d83}
 .small{font:12px Inter,Arial,sans-serif;fill:#5c7388}.tiny{font:11px Inter,Arial,sans-serif;fill:#60798e}
 .mono{font:600 12px ui-monospace,Consolas,monospace;fill:#234762}
 .white{fill:#fff;stroke:#d3dee8;stroke-width:1.3;filter:url(#shadow)}
 .subcard{fill:#f8fafc;stroke:#dbe4ed;stroke-width:1.1}
 .blue{fill:#eaf2fb;stroke:#86a9cc;stroke-width:1.3}.purple{fill:#f1edfa;stroke:#aa9bce;stroke-width:1.3}
 .green{fill:#eaf5ef;stroke:#8db99c;stroke-width:1.3}.amber{fill:#fff5e7;stroke:#d6b276;stroke-width:1.3}
 .teal{fill:#e9f5f5;stroke:#82b6b4;stroke-width:1.3}
 .solid{fill:none;stroke:#496783;stroke-width:2.5;marker-end:url(#arr)}
 .dashed{fill:none;stroke:#b98535;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#goldarr)}
 .tag{font:700 10px Inter,Arial,sans-serif;letter-spacing:.6px}
 </style>
</defs>
<rect width="1800" height="1320" fill="url(#bg)"/>
<rect x="38" y="28" width="1724" height="126" rx="20" fill="url(#header)"/>
<text x="78" y="64" class="eyebrow">DATA2AI  /  PLATFORM ENGINEERING  /  REFERENCE DEPLOYMENT</text>
<text x="78" y="108" class="h1">Spark Lakehouse Agent Platform</text>
<text x="80" y="135" class="sub">Phase 1 · OVH Ubuntu · Docker Compose v2 · Private MCP access through Tailscale</text>
<rect x="1510" y="68" width="206" height="42" rx="21" fill="#d9eee2"/>
<text x="1613" y="94" text-anchor="middle" class="tag" fill="#24633f">PHASE 1 · DEPLOYED BASELINE</text>

<!-- Remote access domain -->
<rect x="48" y="184" width="1704" height="190" rx="18" fill="url(#tail)" stroke="#91afd0" stroke-width="1.5"/>
<text x="76" y="216" class="band">A  /  REMOTE ACCESS &amp; IDENTITY DOMAIN</text>
<text x="1720" y="216" text-anchor="end" class="small">Private tailnet · no public MCP exposure · Funnel disabled</text>

<rect x="82" y="244" width="300" height="94" rx="13" class="white"/>
<text x="108" y="279" class="node">Learner / Engineer</text>
<text x="108" y="303" class="desc">MCP client · IDE · Agent runtime</text>
<text x="108" y="325" class="mono">Tailscale client connected</text>

<path d="M382 291 H478" class="solid"/>
<text x="430" y="276" text-anchor="middle" class="tiny">WireGuard</text>

<rect x="480" y="244" width="330" height="94" rx="13" class="white"/>
<text x="508" y="279" class="node">Private Tailnet</text>
<text x="508" y="303" class="desc">Device identity · ACL / grants</text>
<text x="508" y="325" class="mono">HTTPS · TCP 443</text>

<path d="M810 291 H906" class="solid"/>
<text x="858" y="276" text-anchor="middle" class="tiny">Tailnet route</text>

<rect x="908" y="244" width="350" height="94" rx="13" class="white"/>
<text x="936" y="279" class="node">Tailscale Serve</text>
<text x="936" y="303" class="desc">HTTPS termination · tailnet-only</text>
<text x="936" y="325" class="mono">Proxy → 127.0.0.1:8080</text>

<path d="M1258 291 H1354" class="solid"/>
<text x="1306" y="276" text-anchor="middle" class="tiny">HTTP proxy</text>

<rect x="1356" y="244" width="350" height="94" rx="13" class="white"/>
<text x="1384" y="279" class="node">Nginx MCP Gateway</text>
<text x="1384" y="303" class="desc">Path routing · SSE / streaming</text>
<text x="1384" y="325" class="mono">:8080 · /spark/mcp · /minio/mcp</text>

<!-- host boundary -->
<rect x="48" y="402" width="1704" height="780" rx="22" fill="#f9fbfd" stroke="#8198ae" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="76" y="418" width="420" height="34" rx="17" fill="#dce7f1"/>
<text x="94" y="441" class="band">B  /  OVH UBUNTU HOST · DOCKER COMPOSE</text>
<text x="1720" y="441" text-anchor="end" class="small">Docker bridge: spark-lakehouse-network</text>

<!-- ingress sidecar boundary -->
<rect x="78" y="474" width="1628" height="112" rx="14" fill="#eef4fb" stroke="#9ab4cf" stroke-width="1.2"/>
<text x="102" y="502" class="band">INGRESS SIDECAR</text>
<rect x="320" y="489" width="570" height="72" rx="11" class="blue"/>
<text x="346" y="519" class="node">Tailscale container · userspace networking</text>
<text x="346" y="543" class="desc">Persistent tailscale_state · tagged node identity · TS_HOSTNAME</text>
<rect x="1040" y="489" width="620" height="72" rx="11" class="blue"/>
<text x="1066" y="519" class="node">Shared network namespace with mcp-gateway</text>
<text x="1066" y="543" class="desc">Compose network_mode: service:mcp-gateway · no separate container hostname</text>
<path d="M1530 338 V460 H605 V489" class="solid"/>
<path d="M890 525 H1040" class="solid"/>
<path d="M1350 489 V460 H1530 V338" class="solid" opacity="0"/>

<!-- application plane -->
<rect x="78" y="610" width="1628" height="330" rx="16" fill="#f2f6fa" stroke="#c4d2df" stroke-width="1.2"/>
<text x="102" y="641" class="band">C  /  APPLICATION &amp; COMPUTE PLANE</text>

<!-- MCP cards -->
<rect x="104" y="662" width="490" height="246" rx="14" class="white"/>
<rect x="104" y="662" width="490" height="10" rx="5" fill="#3d6f9e"/>
<text x="132" y="707" class="node">Spark MCP server</text>
<rect x="430" y="682" width="136" height="26" rx="13" fill="#e4edf7"/>
<text x="498" y="700" text-anchor="middle" class="tag" fill="#315d83">READ-ONLY</text>
<text x="132" y="735" class="desc">Container :8000/mcp · host 127.0.0.1:8002</text>
<text x="132" y="770" class="desc">• Session / cluster information</text>
<text x="132" y="797" class="desc">• Database, table and schema discovery</text>
<text x="132" y="824" class="desc">• Single bounded SELECT · row limit enforced</text>
<text x="132" y="870" class="mono">SPARK_MASTER=spark://spark-master:7077</text>

<rect x="620" y="662" width="490" height="246" rx="14" class="white"/>
<rect x="620" y="662" width="490" height="10" rx="5" fill="#16827d"/>
<text x="648" y="707" class="node">MinIO MCP server</text>
<rect x="946" y="682" width="136" height="26" rx="13" fill="#e1f1ef"/>
<text x="1014" y="700" text-anchor="middle" class="tag" fill="#176c69">SCOPED ACCESS</text>
<text x="648" y="735" class="desc">Container :8001/mcp · host 127.0.0.1:8003</text>
<text x="648" y="770" class="desc">• Configured bucket allowlist / object listing</text>
<text x="648" y="797" class="desc">• Metadata and bounded UTF-8 text reads</text>
<text x="648" y="824" class="desc">• Optional writes · disabled by default</text>
<text x="648" y="870" class="mono">MINIO_ENDPOINT=http://minio:9000</text>

<!-- compute -->
<rect x="1136" y="662" width="544" height="246" rx="14" class="white"/>
<rect x="1136" y="662" width="544" height="10" rx="5" fill="#537fa8"/>
<text x="1164" y="707" class="node">Apache Spark Standalone · 3.5.6</text>
<rect x="1164" y="729" width="488" height="58" rx="9" class="blue"/>
<text x="1186" y="754" class="node">Spark Master</text>
<text x="1186" y="775" class="mono">spark-master:7077</text>
<rect x="1164" y="802" width="234" height="74" rx="9" class="subcard"/>
<text x="1186" y="832" class="node">Worker 01</text><text x="1186" y="855" class="desc">2 cores · 3 GiB</text>
<rect x="1418" y="802" width="234" height="74" rx="9" class="subcard"/>
<text x="1440" y="832" class="node">Worker 02</text><text x="1440" y="855" class="desc">2 cores · 3 GiB</text>

<!-- additional services row -->
<rect x="104" y="958" width="500" height="174" rx="14" class="white"/>
<text x="132" y="994" class="node">JupyterLab</text>
<text x="132" y="1022" class="desc">PySpark notebooks · Python workspace</text>
<text x="132" y="1050" class="mono">jupyter:8888 · host 127.0.0.1:8888</text>
<text x="132" y="1092" class="small">Spark client → spark-master:7077</text>

<rect x="628" y="958" width="500" height="174" rx="14" class="white"/>
<text x="656" y="994" class="node">MinIO object storage</text>
<text x="656" y="1022" class="desc">S3 API :9000 · Console :9001</text>
<text x="656" y="1050" class="mono">minio:9000 · bucket allowlist: lakehouse</text>
<text x="656" y="1092" class="small">Independent object store · persistent minio_data volume</text>

<rect x="1152" y="958" width="528" height="174" rx="14" class="white"/>
<text x="1180" y="994" class="node">Ollama</text>
<text x="1180" y="1022" class="desc">Local model runtime · internal API :11434</text>
<text x="1180" y="1050" class="mono">ollama:11434 · host 127.0.0.1:11434</text>
<text x="1180" y="1092" class="small">Model persistence: ollama_models</text>

