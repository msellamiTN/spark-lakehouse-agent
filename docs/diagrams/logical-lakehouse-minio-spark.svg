<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
<title id="title">Logical Lakehouse data architecture with MinIO and Apache Spark</title>
<desc id="desc">A logical Medallion Lakehouse. Data sources land in the MinIO raw zone. Apache Spark reads and writes data through the S3A connector, transforming Raw to Bronze, Silver and Gold Parquet datasets in the same MinIO lakehouse bucket. Jupyter submits workloads to Spark. MCP services expose governed, bounded access to agents and analytics consumers read curated Gold data. Optional catalog, quality, lineage, retention and access controls are shown as governance capabilities to configure.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#122b43"/></linearGradient>
 <linearGradient id="minio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1f2b"/><stop offset="1" stop-color="#bd3e45"/></linearGradient>
 <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b64b13"/><stop offset="1" stop-color="#ed8b32"/></linearGradient>
 <linearGradient id="raw" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#304b68"/><stop offset="1" stop-color="#416887"/></linearGradient>
 <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75502d"/><stop offset="1" stop-color="#b17a3b"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52677b"/><stop offset="1" stop-color="#8299ac"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80621c"/><stop offset="1" stop-color="#c39a35"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#b8d2e7" stroke-width="1.8"/></marker>
 <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#ffb36b" stroke-width="1.8"/></marker>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fb}.muted{fill:#a9bfd1}.tiny{font-size:15px}.small{font-size:17px}.body{font-size:19px}.head{font-size:24px;font-weight:700}.section{font-size:21px;font-weight:700;letter-spacing:1.4px}.title{font-size:38px;font-weight:750}.sub{font-size:20px;fill:#b9cede}.card{stroke:#ffffff26;stroke-width:1.5;filter:url(#shadow)}.line{stroke:#b8d2e7;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.dataLine{stroke:#ffb36b;stroke-width:3.3;fill:none;marker-end:url(#arrowOrange)}.dash{stroke-dasharray:9 8}
 </style>
</defs>
<rect width="1800" height="1120" fill="url(#bg)"/>
<circle cx="1640" cy="80" r="240" fill="#2a5270" opacity=".12"/><circle cx="120" cy="1040" r="260" fill="#bd3e45" opacity=".08"/>
<text x="70" y="75" class="title">LOGICAL LAKEHOUSE DATA ARCHITECTURE</text>
<text x="72" y="112" class="sub">MinIO is the data lake · Apache Spark is the distributed processing engine · Medallion zones are logical object prefixes</text>
<rect x="70" y="145" width="1660" height="890" rx="26" fill="#0b1d30" stroke="#35516b" stroke-width="2"/>
<text x="105" y="190" class="section" fill="#9fc1da">DATA SOURCES &amp; INGESTION</text>
<!-- Sources -->
<g class="card">
 <rect x="105" y="220" width="260" height="170" rx="18" fill="#17334c"/>
 <text x="130" y="258" class="head">Source systems</text>
 <text x="130" y="294" class="body">• Databases / CDC</text><text x="130" y="326" class="body">• Files / APIs / events</text><text x="130" y="358" class="body">• Sample &amp; batch datasets</text>
 <rect x="405" y="220" width="280" height="170" rx="18" fill="#17334c"/>
 <text x="430" y="258" class="head">Ingestion</text>
 <text x="430" y="294" class="body">• Python / connectors</text><text x="430" y="326" class="body">• Spark batch / streaming</text><text x="430" y="358" class="body">• Validate &amp; land source data</text>
</g>
<path d="M365 305 H400" class="line"/><path d="M685 305 H755" class="dataLine"/>
<!-- Minio lake boundary -->
<rect x="745" y="210" width="925" height="570" rx="24" fill="#251a28" stroke="#c75b62" stroke-width="2.5"/>
<rect x="770" y="226" width="330" height="44" rx="12" fill="url(#minio)"/>
<text x="790" y="256" class="head">MINIO OBJECT STORAGE</text>
<text x="1120" y="254" class="small muted">S3-compatible · persistent bucket: lakehouse</text>
<text x="790" y="296" class="small muted">One logical lake · four governed zones · columnar datasets (Parquet baseline)</text>
<!-- Zones -->
<g class="card">
 <rect x="790" y="325" width="190" height="220" rx="17" fill="url(#raw)"/>
 <text x="812" y="365" class="head">RAW</text><text x="812" y="396" class="small">Landing / source</text>
 <text x="812" y="435" class="small">Original payloads</text><text x="812" y="465" class="small">Immutable by policy</text><text x="812" y="505" class="tiny muted">raw/{source}/...</text>
 <rect x="1000" y="325" width="190" height="220" rx="17" fill="url(#bronze)"/>
 <text x="1022" y="365" class="head">BRONZE</text><text x="1022" y="396" class="small">Ingested tables</text>
 <text x="1022" y="435" class="small">Schema + metadata</text><text x="1022" y="465" class="small">Replayable history</text><text x="1022" y="505" class="tiny">bronze/{domain}/...</text>
 <rect x="1210" y="325" width="190" height="220" rx="17" fill="url(#silver)"/>
 <text x="1232" y="365" class="head">SILVER</text><text x="1232" y="396" class="small">Conformed data</text>
 <text x="1232" y="435" class="small">Clean / deduplicate</text><text x="1232" y="465" class="small">Validated / joined</text><text x="1232" y="505" class="tiny">silver/{domain}/...</text>
 <rect x="1420" y="325" width="220" height="220" rx="17" fill="url(#gold)"/>
 <text x="1442" y="365" class="head">GOLD</text><text x="1442" y="396" class="small">Business-ready</text>
 <text x="1442" y="435" class="small">Aggregates / marts</text><text x="1442" y="465" class="small">KPIs / features</text><text x="1442" y="505" class="tiny">gold/{product}/...</text>
</g>
<path d="M980 435 H995" class="dataLine"/><path d="M1190 435 H1205" class="dataLine"/><path d="M1400 435 H1415" class="dataLine"/>
<text x="790" y="585" class="small muted">Additional prefixes: checkpoints/ · schemas/ · quarantine/ · agent-outputs/ (separate write policy)</text>
<rect x="790" y="620" width="850" height="115" rx="16" fill="#351f2a" stroke="#a74a55" stroke-width="1.5"/>
<text x="815" y="656" class="head">S3 API / bucket boundary</text>
<text x="815" y="690" class="body">Endpoint: http://minio:9000 (internal) · bucket: lakehouse · paths are object prefixes, not native folders</text>
<text x="815" y="718" class="small muted">Spark identity: read/write lakehouse zones · MCP identity: separate least-privilege, tool-scoped access</text>
<!-- Spark processing -->
<rect x="105" y="455" width="580" height="320" rx="22" fill="#2c211b" stroke="#d77a36" stroke-width="2.5" class="card"/>
<rect x="130" y="477" width="250" height="44" rx="12" fill="url(#spark)"/>
<text x="150" y="507" class="head">APACHE SPARK 3.5.x</text>
<text x="130" y="555" class="body">Distributed transformation engine</text>
<rect x="130" y="580" width="155" height="88" rx="12" fill="#4b3021" stroke="#c97836"/>
<text x="150" y="615" class="head">Master</text><text x="150" y="645" class="small">Scheduling</text>
<rect x="305" y="580" width="155" height="88" rx="12" fill="#4b3021" stroke="#c97836"/>
<text x="325" y="615" class="head">Worker 1</text><text x="325" y="645" class="small">Executors</text>
<rect x="480" y="580" width="175" height="88" rx="12" fill="#4b3021" stroke="#c97836"/>
<text x="500" y="615" class="head">Worker 2</text><text x="500" y="645" class="small">Executors</text>
<text x="130" y="712" class="small" fill="#ffc28c">S3A connector + Hadoop AWS + AWS SDK</text>
<text x="130" y="744" class="tiny muted">s3a://lakehouse/{raw|bronze|silver|gold}/...</text>
<!-- Bidirectional Spark Minio -->
<path d="M685 565 C715 565 715 565 745 565" class="dataLine"/>
<text x="690" y="542" class="tiny" fill="#ffbd80" text-anchor="middle">S3A</text>
<path d="M685 700 C720 700 720 690 790 690" class="dataLine"/>
<!-- Jupyter -->
<rect x="105" y="815" width="275" height="135" rx="17" fill="#17334c" stroke="#5c8dad" class="card"/>
<text x="130" y="855" class="head">JupyterLab</text><text x="130" y="888" class="small">PySpark notebooks</text><text x="130" y="918" class="small">Submit jobs to Spark</text>
<path d="M245 815 V780" class="line"/>
<!-- governance -->
<rect x="420" y="815" width="450" height="135" rx="17" fill="#17334c" stroke="#547b99" class="card"/>
<text x="445" y="855" class="head">Data governance &amp; operations</text>
<text x="445" y="888" class="small">Catalog / schemas · quality checks · lineage</text>
<text x="445" y="918" class="small">IAM / bucket policies · lifecycle · backup</text>
<text x="445" y="941" class="tiny muted">Capabilities to configure; not assumed deployed</text>
<!-- consumer / agents -->
<rect x="920" y="815" width="720" height="135" rx="17" fill="#17334c" stroke="#547b99" class="card"/>
<text x="945" y="855" class="head">Consumption &amp; agent access</text>
<rect x="945" y="875" width="195" height="52" rx="10" fill="#1c405a"/><text x="960" y="908" class="small">BI / SQL / APIs</text>
<rect x="1155" y="875" width="210" height="52" rx="10" fill="#1c405a"/><text x="1170" y="908" class="small">Spark MCP (read-only)</text>
<rect x="1380" y="875" width="235" height="52" rx="10" fill="#1c405a"/><text x="1395" y="908" class="small">MinIO MCP (scoped)</text>
<path d="M1530 545 V795 H1050 V810" class="line"/>
<path d="M1510 780 V865" class="line dash"/>
<!-- footer -->
<text x="105" y="995" class="small muted">DATA FLOW: Sources → MinIO Raw → Spark S3A transformations → MinIO Bronze → Silver → Gold → Consumers / Agents</text>
<text x="105" y="1020" class="tiny muted">Design principle: MinIO owns durable lake data; Spark computes over object storage. Do not use a parallel local filesystem as the canonical lake.</text>
</svg>