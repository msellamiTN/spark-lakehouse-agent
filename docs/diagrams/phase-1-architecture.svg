<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Data2AI | Spark Lakehouse Agent Platform — Phase 1 deployment architecture</title>
<desc id="desc">Professional deployment view of the Phase 1 local Docker Compose environment: Spark Standalone master and two workers, JupyterLab, Ollama, MinIO and shared lakehouse filesystem. MinIO S3A integration is explicitly planned for Phase 2.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e9eff6"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10243d"/><stop offset="1" stop-color="#1c456b"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity=".09"/></filter>
  <marker id="solidArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#42617f"/></marker>
  <marker id="futureArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b27b28"/></marker>
  <style>
    .title{font:700 31px Inter,Arial,sans-serif;fill:#fff}.subtitle{font:15px Inter,Arial,sans-serif;fill:#d4e1ee}
    .eyebrow{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.7px;fill:#9eb8d0}
    .section{font:700 16px Inter,Arial,sans-serif;letter-spacing:.5px;fill:#213d59}
    .cardTitle{font:700 17px Inter,Arial,sans-serif;fill:#17324d}
    .body{font:14px Inter,Arial,sans-serif;fill:#425b73}.muted{font:12px Inter,Arial,sans-serif;fill:#637b91}
    .micro{font:11px Inter,Arial,sans-serif;fill:#637b91}.code{font:600 12px ui-monospace,Consolas,monospace;fill:#24445f}
    .panel{fill:#fff;stroke:#d5e0ea;stroke-width:1.3;filter:url(#shadow)}
    .inner{fill:#f8fafc;stroke:#dce5ee;stroke-width:1}
    .runtime{fill:#eaf2fb;stroke:#8eafd0}.compute{fill:#eaf2fb;stroke:#7da3c8}
    .notebook{fill:#f1edfa;stroke:#a897cc}.ai{fill:#eaf5ef;stroke:#8ab69a}
    .object{fill:#fff5e5;stroke:#d7b16f}.pillText{font:700 10px Inter,Arial,sans-serif;letter-spacing:.5px}
    .flow{fill:none;stroke:#42617f;stroke-width:2.5;marker-end:url(#solidArrow)}
    .future{fill:none;stroke:#b27b28;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#futureArrow)}
  </style>
</defs>
<rect width="1600" height="1040" fill="url(#canvas)"/>
<rect x="42" y="34" width="1516" height="128" rx="20" fill="url(#navy)"/>
<text x="82" y="68" class="eyebrow">DATA2AI  /  PLATFORM ENGINEERING</text>
<text x="82" y="111" class="title">Spark Lakehouse Agent Platform</text>
<text x="84" y="139" class="subtitle">Phase 1 deployment architecture  ·  Local development environment  ·  Docker Compose v2</text>
<rect x="1320" y="75" width="190" height="38" rx="19" fill="#d9eee2"/>
<text x="1415" y="99" text-anchor="middle" class="pillText" fill="#24633f">PHASE 1 · BASELINE</text>

<rect x="54" y="190" width="1492" height="676" rx="22" fill="#f9fbfd" stroke="#9fb3c7" stroke-width="1.8" stroke-dasharray="7 6"/>
<rect x="78" y="210" width="300" height="28" rx="14" fill="#e5edf5"/>
<text x="94" y="229" class="section">LOCAL HOST / DOCKER NETWORK</text>
<text x="1515" y="229" text-anchor="end" class="muted">spark-lakehouse-network · bridge</text>

<!-- Spark cluster -->
<rect x="86" y="264" width="590" height="278" rx="16" class="panel"/>
<text x="116" y="300" class="cardTitle">01  Distributed compute</text>
<text x="116" y="323" class="muted">Apache Spark Standalone · image 3.5.6</text>
<rect x="116" y="348" width="530" height="76" rx="11" class="compute"/>
<text x="140" y="378" class="cardTitle">Spark Master</text>
<text x="140" y="401" class="body">Cluster coordinator · RPC 7077 · Web UI 8080</text>
<rect x="116" y="445" width="252" height="72" rx="10" class="inner"/>
<text x="138" y="475" class="cardTitle">Worker 01</text>
<text x="138" y="498" class="body">2 cores · 3 GiB · UI 8081</text>
<rect x="394" y="445" width="252" height="72" rx="10" class="inner"/>
<text x="416" y="475" class="cardTitle">Worker 02</text>
<text x="416" y="498" class="body">2 cores · 3 GiB · UI 8082</text>
<path d="M381 424 V435 H242 V445 M381 435 H520 V445" class="flow"/>

<!-- Jupyter -->
<rect x="710" y="264" width="365" height="278" rx="16" class="panel"/>
<text x="740" y="300" class="cardTitle">02  Engineering workspace</text>
<text x="740" y="323" class="muted">JupyterLab · custom Spark/Python image</text>
<rect x="740" y="350" width="305" height="112" rx="11" class="notebook"/>
<text x="762" y="382" class="cardTitle">JupyterLab</text>
<text x="762" y="408" class="body">PySpark notebooks &amp; validation</text>
<text x="762" y="434" class="code">localhost:8888</text>
<rect x="740" y="480" width="305" height="36" rx="8" fill="#f4f1fa"/>
<text x="892" y="503" text-anchor="middle" class="muted">Spark client → spark-master:7077</text>
<path d="M676 386 H700" class="flow"/>

<!-- Ollama -->
<rect x="1108" y="264" width="408" height="278" rx="16" class="panel"/>
<text x="1138" y="300" class="cardTitle">03  Local model runtime</text>
<text x="1138" y="323" class="muted">Ollama · model lifecycle and inference API</text>
<rect x="1138" y="350" width="348" height="112" rx="11" class="ai"/>
<text x="1160" y="382" class="cardTitle">Qwen 2.5 · 3B</text>
<text x="1160" y="408" class="body">Model pulled separately after startup</text>
<text x="1160" y="434" class="code">localhost:11434</text>
<rect x="1138" y="480" width="348" height="36" rx="8" fill="#eef6f0"/>
<text x="1312" y="503" text-anchor="middle" class="muted">Container endpoint: http://ollama:11434</text>

<!-- shared filesystem -->
<rect x="86" y="584" width="990" height="238" rx="16" class="panel"/>
<text x="116" y="621" class="cardTitle">04  Shared lakehouse filesystem</text>
<text x="116" y="645" class="muted">Host project directory mounted at /lakehouse in Spark and Jupyter containers</text>
<rect x="116" y="676" width="200" height="104" rx="10" class="object"/>
<text x="216" y="711" text-anchor="middle" class="cardTitle">RAW</text>
<text x="216" y="739" text-anchor="middle" class="muted">Source landing</text>
<rect x="336" y="676" width="200" height="104" rx="10" class="object"/>
<text x="436" y="711" text-anchor="middle" class="cardTitle">BRONZE</text>
<text x="436" y="739" text-anchor="middle" class="muted">Source-aligned data</text>
<rect x="556" y="676" width="200" height="104" rx="10" class="object"/>
<text x="656" y="711" text-anchor="middle" class="cardTitle">SILVER</text>
<text x="656" y="739" text-anchor="middle" class="muted">Cleaned &amp; conformed</text>
<rect x="776" y="676" width="270" height="104" rx="10" class="object"/>
<text x="911" y="711" text-anchor="middle" class="cardTitle">GOLD / CHECKPOINTS</text>
<text x="911" y="739" text-anchor="middle" class="muted">Curated data &amp; processing state</text>
<path d="M316 728 H332 M536 728 H552 M756 728 H772" class="flow"/>

<!-- MinIO -->
<rect x="1108" y="584" width="408" height="238" rx="16" class="panel"/>
<text x="1138" y="621" class="cardTitle">05  Object storage service</text>
<text x="1138" y="645" class="muted">MinIO · S3-compatible API</text>
<rect x="1138" y="676" width="348" height="104" rx="10" class="ai"/>
<text x="1160" y="711" class="cardTitle">MinIO</text>
<text x="1160" y="739" class="body">API 9000 · Console 9001</text>
<text x="1160" y="761" class="muted">Persistent Docker volume</text>

<!-- connectors to shared storage -->
<path d="M380 542 V566 H570 V580" class="flow"/>
<path d="M892 542 V566 H790 V580" class="flow"/>
<path d="M1076 728 H1098" class="future"/>

<!-- legend / boundary -->
<rect x="86" y="888" width="1430" height="102" rx="15" fill="#fff" stroke="#d5e0ea"/>
<text x="116" y="923" class="section">IMPLEMENTATION STATUS</text>
<path d="M360 918 H420" class="flow"/><text x="435" y="923" class="body">Implemented Phase 1 connectivity / shared mounts</text>
<path d="M850 918 H910" class="future"/><text x="925" y="923" class="body">Planned Phase 2 integration</text>
<text x="116" y="958" class="muted">Phase 1: Spark processing uses the shared local filesystem. MinIO is deployed, but Spark S3A dependencies, bucket provisioning and S3A access are not configured yet.</text>
<text x="1515" y="1020" text-anchor="end" class="micro">DATA2AI  ·  Architecture baseline  ·  Development topology, not a production security blueprint</text>
</svg>