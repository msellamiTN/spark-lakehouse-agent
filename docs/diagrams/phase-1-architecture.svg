<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">Data2AI — Spark Lakehouse Agent Platform with Spark and MinIO MCP servers</title>
<desc id="desc">Phase 1 local Docker Compose architecture. Spark Standalone, JupyterLab, Ollama and MinIO are deployed with two MCP servers. Spark MCP provides read-only catalog and SQL tools to agents; MinIO MCP provides allowlisted object discovery and optional controlled text writes. Spark S3A integration remains a future Phase 2 connection.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e9eff6"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10243d"/><stop offset="1" stop-color="#1c456b"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity=".09"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#42617f"/></marker>
  <marker id="futureArrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b27b28"/></marker>
  <style>
    .title{font:700 31px Inter,Arial,sans-serif;fill:#fff}.subtitle{font:15px Inter,Arial,sans-serif;fill:#d4e1ee}
    .eyebrow{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.7px;fill:#9eb8d0}
    .section{font:700 15px Inter,Arial,sans-serif;letter-spacing:.5px;fill:#213d59}
    .cardTitle{font:700 17px Inter,Arial,sans-serif;fill:#17324d}
    .body{font:14px Inter,Arial,sans-serif;fill:#425b73}.muted{font:12px Inter,Arial,sans-serif;fill:#637b91}
    .micro{font:11px Inter,Arial,sans-serif;fill:#637b91}.code{font:600 12px ui-monospace,Consolas,monospace;fill:#24445f}
    .panel{fill:#fff;stroke:#d5e0ea;stroke-width:1.3;filter:url(#shadow)}
    .inner{fill:#f8fafc;stroke:#dce5ee;stroke-width:1}
    .compute{fill:#eaf2fb;stroke:#7da3c8}.notebook{fill:#f1edfa;stroke:#a897cc}
    .ai{fill:#eaf5ef;stroke:#8ab69a}.object{fill:#fff5e5;stroke:#d7b16f}
    .mcp{fill:#edf2fb;stroke:#6689b3;stroke-width:1.4}.pillText{font:700 10px Inter,Arial,sans-serif;letter-spacing:.5px}
    .flow{fill:none;stroke:#42617f;stroke-width:2.3;marker-end:url(#arrow)}
    .future{fill:none;stroke:#b27b28;stroke-width:2.3;stroke-dasharray:8 7;marker-end:url(#futureArrow)}
  </style>
</defs>
<rect width="1600" height="1160" fill="url(#canvas)"/>
<rect x="42" y="30" width="1516" height="126" rx="20" fill="url(#navy)"/>
<text x="82" y="65" class="eyebrow">DATA2AI  /  PLATFORM ENGINEERING</text>
<text x="82" y="108" class="title">Spark Lakehouse Agent Platform</text>
<text x="84" y="136" class="subtitle">Phase 1 deployment architecture  ·  Spark + MinIO MCP interfaces  ·  Docker Compose v2</text>
<rect x="1320" y="72" width="190" height="38" rx="19" fill="#d9eee2"/>
<text x="1415" y="96" text-anchor="middle" class="pillText" fill="#24633f">PHASE 1 · BASELINE</text>

<rect x="54" y="184" width="1492" height="806" rx="22" fill="#f9fbfd" stroke="#9fb3c7" stroke-width="1.8" stroke-dasharray="7 6"/>
<rect x="78" y="202" width="320" height="28" rx="14" fill="#e5edf5"/>
<text x="94" y="221" class="section">DOCKER COMPOSE NETWORK</text>
<text x="1515" y="221" text-anchor="end" class="muted">spark-lakehouse-network · bridge · local workstation</text>

<!-- Core services -->
<rect x="82" y="252" width="430" height="242" rx="16" class="panel"/>
<text x="110" y="287" class="cardTitle">01  Apache Spark Standalone</text>
<text x="110" y="310" class="muted">Spark 3.5.6 · distributed compute</text>
<rect x="110" y="334" width="374" height="62" rx="10" class="compute"/>
<text x="130" y="360" class="cardTitle">Spark Master</text>
<text x="130" y="382" class="muted">RPC 7077 · Web UI 8080</text>
<rect x="110" y="411" width="174" height="60" rx="9" class="inner"/>
<text x="128" y="436" class="cardTitle">Worker 01</text><text x="128" y="456" class="muted">2 cores · 3 GiB · UI 8081</text>
<rect x="310" y="411" width="174" height="60" rx="9" class="inner"/>
<text x="328" y="436" class="cardTitle">Worker 02</text><text x="328" y="456" class="muted">2 cores · 3 GiB · UI 8082</text>
<path d="M297 396 V403 H197 V411 M297 403 H397 V411" class="flow"/>

<rect x="532" y="252" width="290" height="242" rx="16" class="panel"/>
<text x="560" y="287" class="cardTitle">02  JupyterLab</text>
<text x="560" y="310" class="muted">Custom Spark + Python image</text>
<rect x="560" y="342" width="234" height="98" rx="10" class="notebook"/>
<text x="580" y="374" class="cardTitle">PySpark workspace</text>
<text x="580" y="400" class="body">Notebooks · experiments</text>
<text x="580" y="424" class="code">localhost:8888</text>
<text x="560" y="466" class="muted">Spark client → spark-master:7077</text>
<path d="M560 376 H500" class="flow"/>

<rect x="842" y="252" width="290" height="242" rx="16" class="panel"/>
<text x="870" y="287" class="cardTitle">03  Ollama</text>
<text x="870" y="310" class="muted">Local model runtime</text>
<rect x="870" y="342" width="234" height="98" rx="10" class="ai"/>
<text x="890" y="374" class="cardTitle">Qwen 2.5 · 3B</text>
<text x="890" y="400" class="body">Model pulled separately</text>
<text x="890" y="424" class="code">localhost:11434</text>
<text x="870" y="466" class="muted">Internal API: ollama:11434</text>

<rect x="1152" y="252" width="360" height="242" rx="16" class="panel"/>
<text x="1180" y="287" class="cardTitle">04  MinIO</text>
<text x="1180" y="310" class="muted">S3-compatible object storage</text>
<rect x="1180" y="342" width="304" height="98" rx="10" class="ai"/>
<text x="1200" y="374" class="cardTitle">MinIO object service</text>
<text x="1200" y="400" class="body">S3 API 9000 · Console 9001</text>
<text x="1200" y="424" class="muted">Persistent Docker volume</text>
<text x="1180" y="466" class="muted">Bucket access controlled by MinIO IAM</text>

<!-- MCP services -->
<rect x="82" y="535" width="690" height="220" rx="16" class="panel"/>
<text x="112" y="573" class="cardTitle">05  Spark MCP server</text>
<rect x="574" y="551" width="164" height="28" rx="14" fill="#e5edf5"/>
<text x="656" y="570" text-anchor="middle" class="pillText" fill="#345675">READ-ONLY TOOLS</text>
<text x="112" y="600" class="muted">Streamable HTTP · container endpoint :8000 · host endpoint localhost:8002/mcp</text>
<rect x="112" y="622" width="630" height="100" rx="10" class="mcp"/>
<text x="134" y="650" class="body">• Session information and catalog discovery</text>
<text x="134" y="675" class="body">• Database/table listing and schema inspection</text>
<text x="134" y="700" class="body">• Bounded SELECT queries · default 100 rows · hard cap 500</text>

<rect x="798" y="535" width="714" height="220" rx="16" class="panel"/>
<text x="828" y="573" class="cardTitle">06  MinIO MCP server</text>
<rect x="1310" y="551" width="172" height="28" rx="14" fill="#e5edf5"/>
<text x="1396" y="570" text-anchor="middle" class="pillText" fill="#345675">SCOPED ACCESS</text>
<text x="828" y="600" class="muted">Streamable HTTP · container endpoint :8001 · host endpoint localhost:8003/mcp</text>
<rect x="828" y="622" width="654" height="100" rx="10" class="mcp"/>
<text x="850" y="650" class="body">• Allowlisted bucket and object discovery</text>
<text x="850" y="675" class="body">• Object metadata and bounded text reads</text>
<text x="850" y="700" class="body">• Optional text writes · disabled by default · prefix restricted</text>

<!-- Active connections -->
<path d="M512 376 H522" class="flow"/>
<path d="M430 535 V515 H297 V498" class="flow"/>
<path d="M1150 535 V515 H1332 V498" class="flow"/>

<!-- Shared filesystem -->
<rect x="82" y="790" width="1430" height="150" rx="16" class="panel"/>
<text x="112" y="828" class="cardTitle">07  Shared lakehouse filesystem</text>
<text x="112" y="852" class="muted">Host-mounted directory at /lakehouse · shared by Spark master/workers, JupyterLab and Spark MCP</text>
<rect x="112" y="874" width="180" height="44" rx="8" class="object"/><text x="202" y="902" text-anchor="middle" class="cardTitle">RAW / BRONZE</text>
<rect x="310" y="874" width="180" height="44" rx="8" class="object"/><text x="400" y="902" text-anchor="middle" class="cardTitle">SILVER</text>
<rect x="508" y="874" width="180" height="44" rx="8" class="object"/><text x="598" y="902" text-anchor="middle" class="cardTitle">GOLD</text>
<rect x="706" y="874" width="220" height="44" rx="8" class="object"/><text x="816" y="902" text-anchor="middle" class="cardTitle">CHECKPOINTS</text>
<text x="970" y="888" class="muted">Phase 1 data path: shared local filesystem</text>
<text x="970" y="910" class="muted">MinIO persists independently in its named volume</text>

<!-- Agent client outside the Compose network -->
<rect x="82" y="1010" width="1430" height="96" rx="16" fill="#edf2fb" stroke="#9aafc7" stroke-width="1.4"/>
<text x="112" y="1047" class="cardTitle">Compatible agent runtime / MCP host</text>
<text x="112" y="1075" class="body">Not bundled in Phase 1 · connect from the host via localhost:8002/mcp and localhost:8003/mcp</text>
<path d="M430 1010 V970 H430 V760" class="flow"/>
<path d="M1140 1010 V970 H1140 V760" class="flow"/>

<!-- Future integration boundary and legend -->
<path d="M1450 790 V770 H1490 V498" class="future"/>
<text x="1490" y="770" text-anchor="end" class="micro">Spark S3A · Phase 2</text>
<path d="M1180 970 H1240" class="flow"/>
<text x="1260" y="975" class="micro">Configured path</text>
<path d="M1360 970 H1420" class="future"/>
<text x="1440" y="975" class="micro">Future</text>
<text x="1512" y="1140" text-anchor="end" class="micro">DATA2AI  ·  Architecture baseline  ·  Local development topology, not production security blueprint</text>
</svg>