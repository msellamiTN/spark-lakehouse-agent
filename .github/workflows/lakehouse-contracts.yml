name: Lakehouse contract validation

on:
  pull_request:
    paths:
      - ".github/workflows/lakehouse-contracts.yml"
      - "docs/contracts/**"
      - "scripts/validate_lakehouse_contracts.py"
      - "tests/test_lakehouse_contracts.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lakehouse-contracts.yml"
      - "docs/contracts/**"
      - "scripts/validate_lakehouse_contracts.py"
      - "tests/test_lakehouse_contracts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dataset contracts
        run: python scripts/validate_lakehouse_contracts.py

      - name: Run contract unit tests
        run: python -m unittest discover -s tests -v
