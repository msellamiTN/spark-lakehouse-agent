<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
<title id="title">Spark Lakehouse Agent Platform — Professional deployment architecture</title>
<desc id="desc">Detailed Phase 1 deployment architecture showing remote users connecting over a private Tailscale tailnet to a Dockerized Tailscale node, Tailscale Serve, Nginx gateway, Spark MCP and MinIO MCP. The private Docker network contains Spark Standalone, JupyterLab, Ollama and MinIO. Persistent filesystem and named volumes are shown. Spark S3A integration is explicitly marked Phase 2.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e8eef5"/></linearGradient>
 <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#102a43"/><stop offset="1" stop-color="#1e5276"/></linearGradient>
 <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f3ff"/><stop offset="1" stop-color="#dceafa"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16324b" flood-opacity=".10"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10Z" fill="#496783"/></marker>
 <marker id="goldarr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10Z" fill="#b98535"/></marker>
 <style>
