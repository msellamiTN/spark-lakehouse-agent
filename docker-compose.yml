name: spark-lakehouse-agent

services:
  spark-master:
    build:
      context: ./infrastructure/spark
      args:
        SPARK_BASE_IMAGE: ${SPARK_BASE_IMAGE:-apache/spark:3.5.6-scala2.12-java17-python3-ubuntu}
        HADOOP_VERSION: ${HADOOP_VERSION:-3.3.4}
        AWS_SDK_BUNDLE_VERSION: ${AWS_SDK_BUNDLE_VERSION:-1.12.262}
    image: ${SPARK_IMAGE:-spark-lakehouse-s3a:3.5.6}
    container_name: lakehouse-spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - ./lakehouse:/lakehouse
      - ./infrastructure/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-worker-1:
    image: ${SPARK_IMAGE:-spark-lakehouse-s3a:3.5.6}
    container_name: lakehouse-spark-worker-1
    hostname: spark-worker-1
    env_file:
      - ./secrets/spark-s3a.env
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --host spark-worker-1
      --port 8881
      --webui-port 8081
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-3g}
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:${SPARK_WORKER_1_UI_PORT:-8081}:8081"
    volumes:
      - ./lakehouse:/lakehouse
      - ./infrastructure/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      spark-master:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-worker-2:
    image: ${SPARK_IMAGE:-spark-lakehouse-s3a:3.5.6}
    container_name: lakehouse-spark-worker-2
    hostname: spark-worker-2
    env_file:
      - ./secrets/spark-s3a.env
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --host spark-worker-2
      --port 8882
      --webui-port 8082
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-3g}
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:${SPARK_WORKER_2_UI_PORT:-8082}:8082"
    volumes:
      - ./lakehouse:/lakehouse
      - ./infrastructure/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      spark-master:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  jupyter:
    build:
      context: ./infrastructure/jupyter
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-spark-lakehouse-s3a:3.5.6}
    image: ${JUPYTER_IMAGE}
    container_name: lakehouse-jupyter
    hostname: jupyter
    env_file:
      - ./secrets/spark-s3a.env
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      SPARK_MASTER: spark://spark-master:7077
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      LAKEHOUSE_HOME: /lakehouse
      PYTHONPATH: /workspace:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./retail:/workspace/retail
      - ./lakehouse:/lakehouse
      - ./infrastructure/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - jupyter_config:/home/spark/.jupyter
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      bash -lc "jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --ServerApp.token=$${JUPYTER_TOKEN}
      --ServerApp.allow_remote_access=True
      --ServerApp.root_dir=/workspace"
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request; urllib.request.urlopen('http://localhost:8888/api?token='+os.environ['JUPYTER_TOKEN'], timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: lakehouse-ollama
    hostname: ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE}
    container_name: lakehouse-minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [lakehouse]
    restart: unless-stopped

  # One-shot MinIO administration client. Built locally from a pinned, checksum-verified binary.
  minio-init:
    image: spark-lakehouse-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ./infrastructure/minio/mc
      dockerfile: Dockerfile
    profiles: ["bootstrap"]
    volumes:
      - ./secrets:/secrets
      - ./infrastructure/minio/policies:/policies:ro
    networks: [lakehouse]
    restart: "no"

  spark-mcp:
    env_file:
      - ./secrets/spark-s3a.env
    build:
      context: ./infrastructure/mcp
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-spark-lakehouse-s3a:3.5.6}
    image: ${MCP_IMAGE:-spark-lakehouse-mcp:3.5.6}
    container_name: lakehouse-spark-mcp
    hostname: spark-mcp
    command: ["python3", "/app/spark_server.py"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      SPARK_MASTER: spark://spark-master:7077
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      SPARK_MCP_MAX_ROWS: ${SPARK_MCP_MAX_ROWS:-100}
      SPARK_MCP_HARD_MAX_ROWS: ${SPARK_MCP_HARD_MAX_ROWS:-500}
    ports:
      - "127.0.0.1:${SPARK_MCP_PORT:-8002}:8000"
    volumes:
      - ./lakehouse:/lakehouse
      - ./infrastructure/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [lakehouse]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  minio-mcp:
    env_file:
      - ./secrets/minio-mcp.env
    build:
      context: ./infrastructure/mcp
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-spark-lakehouse-s3a:3.5.6}
    image: ${MCP_IMAGE:-spark-lakehouse-mcp:3.5.6}
    container_name: lakehouse-minio-mcp
    hostname: minio-mcp
    command: ["python3", "/app/minio_server.py"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_MCP_ALLOWED_BUCKETS: ${MINIO_MCP_ALLOWED_BUCKETS:-lakehouse}
      MINIO_MCP_ALLOW_WRITES: ${MINIO_MCP_ALLOW_WRITES:-false}
      MINIO_MCP_WRITE_PREFIXES: ${MINIO_MCP_WRITE_PREFIXES:-agent-outputs/}
      MINIO_MCP_MAX_READ_BYTES: ${MINIO_MCP_MAX_READ_BYTES:-1048576}
      MINIO_MCP_MAX_WRITE_BYTES: ${MINIO_MCP_MAX_WRITE_BYTES:-1048576}
    ports:
      - "127.0.0.1:${MINIO_MCP_PORT:-8003}:8001"
    depends_on:
      minio:
        condition: service_started
    networks: [lakehouse]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Internal reverse proxy. It is reachable through Tailscale Serve, not the public Internet.
  mcp-gateway:
    image: nginx:1.27-alpine
    container_name: lakehouse-mcp-gateway
    hostname: mcp-gateway
    volumes:
      - ./infrastructure/tailscale/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${MCP_GATEWAY_LOCAL_PORT:-8088}:8080"
    depends_on:
      spark-mcp:
        condition: service_healthy
      minio-mcp:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Tailscale runs entirely in Docker userspace networking: no host tailscaled,
  # /dev/net/tun, NET_ADMIN, or host-level Serve configuration is required.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: lakehouse-tailscale
    # Do not set container hostname when sharing another service network namespace.
    # TS_HOSTNAME below sets the Tailscale device name.
    network_mode: "service:mcp-gateway"
    depends_on:
      mcp-gateway:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env to a tagged Tailscale auth key}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${TS_HOSTNAME:-spark-lakehouse-agent}
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:spark-lakehouse-mcp
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./infrastructure/tailscale:/config:ro
    restart: unless-stopped

networks:
  lakehouse:
    name: spark-lakehouse-network
    driver: bridge

volumes:
  jupyter_config:
  ollama_models:
  minio_data:
  tailscale_state:
