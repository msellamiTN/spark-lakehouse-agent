name: spark-lakehouse-agent

services:
  spark-master:
    image: ${SPARK_IMAGE}
    container_name: lakehouse-spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - ./lakehouse:/lakehouse
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-worker-1:
    image: ${SPARK_IMAGE}
    container_name: lakehouse-spark-worker-1
    hostname: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --host spark-worker-1
      --port 8881
      --webui-port 8081
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-3g}
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:${SPARK_WORKER_1_UI_PORT:-8081}:8081"
    volumes:
      - ./lakehouse:/lakehouse
    depends_on:
      spark-master:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  spark-worker-2:
    image: ${SPARK_IMAGE}
    container_name: lakehouse-spark-worker-2
    hostname: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --host spark-worker-2
      --port 8882
      --webui-port 8082
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-3g}
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:${SPARK_WORKER_2_UI_PORT:-8082}:8082"
    volumes:
      - ./lakehouse:/lakehouse
    depends_on:
      spark-master:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  jupyter:
    build:
      context: ./infrastructure/jupyter
      args:
        SPARK_IMAGE: ${SPARK_IMAGE}
    image: ${JUPYTER_IMAGE}
    container_name: lakehouse-jupyter
    hostname: jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      SPARK_MASTER: spark://spark-master:7077
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      LAKEHOUSE_HOME: /lakehouse
      PYTHONPATH: /workspace
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./retail:/workspace/retail
      - ./lakehouse:/lakehouse
      - jupyter_config:/home/spark/.jupyter
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    command: >
      bash -lc "jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --ServerApp.token=$${JUPYTER_TOKEN}
      --ServerApp.allow_remote_access=True
      --ServerApp.root_dir=/workspace"
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request; urllib.request.urlopen('http://localhost:8888/api?token='+os.environ['JUPYTER_TOKEN'], timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: lakehouse-ollama
    hostname: ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE}
    container_name: lakehouse-minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [lakehouse]
    restart: unless-stopped

networks:
  lakehouse:
    name: spark-lakehouse-network
    driver: bridge

volumes:
  jupyter_config:
  ollama_models:
  minio_data:
